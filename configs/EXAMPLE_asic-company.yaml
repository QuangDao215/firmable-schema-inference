# A worked example of what the agent must emit. Hand-written, for illustration
# only. The six real configs are generated by the agent in stage C.
#
# Validates against config/mapping_config.schema.json.

config_version: "1.0"
source_id: "asic-company-dataset"

generated_by:
  agent_version: "0.1"
  model: "gemini-3.7-flash"
  generated_at: "2026-09-19T14:02:11"
  revisions: 1                    # needed one correction round
  approved_by: "dao.lq"
  approved_at: "2026-09-19T14:09:40"

resource:
  url: "https://data.gov.au/.../download/company_202609.csv"
  catalogue_format: "CSV"         # what the publisher claimed
  real_format: "CSV"              # what the bytes actually are
  encoding: "utf-8"
  delimiter: "\t"                 # claimed CSV, is tab separated
  header_row: 0

record_id:
  strategy: "source_field"
  fields: ["ACN"]
  note: "ACN is unique per company in this register."

observation:
  licence: "Creative Commons Attribution 4.0 International"
  source_reliability: 0.95        # ASIC on company registration. One per source.
  observed_at:
    from_field: "Current Name Start Date"
    formats: ["%d/%m/%Y"]
    fallback_constant: "2026-09-01"   # dataset modified date

field_mappings:

  - canonical_field: "entity.legal_name"
    source_field: "Company Name"
    transforms:
      - op: strip
      - op: collapse_spaces
    field_confidence: 0.98
    derivation_level: "L0"

  - canonical_field: "entity.acn"
    source_field: "ACN"
    transforms:
      - op: digits_only
      - op: acn_normalize        # returns nothing if the checksum fails
    field_confidence: 0.99
    derivation_level: "L1"

  - canonical_field: "entity.entity_type"
    source_field: "Type"
    transforms:
      - op: map_values
        mapping:
          APTY: "company"
          APUB: "company"
          ASSN: "incorporated_association"
          ATRT: "trust"
        default: "unknown"       # never guess. The ontology says so.
    field_confidence: 0.85
    derivation_level: "L1"
    note: "ASIC type codes. Four of nine codes mapped, rest fall to unknown."

  - canonical_field: "entity.status"
    source_field: "Status"
    transforms:
      - op: map_values
        mapping:
          REGD: "active"
          DERG: "deregistered"
          EXAD: "in_liquidation"
        default: "unknown"
    field_confidence: 0.90
    derivation_level: "L1"

  - canonical_field: "entity.date_registered"
    source_field: "Date of Registration"
    transforms:
      - op: parse_date
        formats: ["%d/%m/%Y", "%Y-%m-%d"]
    field_confidence: 0.92
    derivation_level: "L1"

  - canonical_field: "address.state"
    source_field: "Registered State"
    transforms:
      - op: state_normalize
    field_confidence: 0.88
    derivation_level: "L1"

  - canonical_field: "address.postcode"
    source_field: "Registered Postcode"
    transforms:
      - op: postcode_extract
    field_confidence: 0.90
    derivation_level: "L1"

  - canonical_field: "address.country"
    transforms:
      - op: constant
        value_to_use: "AU"
    field_confidence: 0.99
    derivation_level: "L1"
    note: "No country column. This is an Australian register."

# Columns we chose not to map. Listed, not guessed at.
unmapped_source_fields:
  - source_field: "Previous State of Registration"
    reason: "Historical. The ontology has no field for a prior jurisdiction."
    example_values: ["NSW", "VIC"]
  - source_field: "Modified Since Last Report"
    reason: "A publishing flag about the file, not a fact about the company."
    example_values: ["Y", "N"]

# Ontology fields this source cannot fill.
unfilled_canonical_fields:
  - canonical_field: "entity.abn"
    reason: "ASIC publishes ACN only. The last 9 digits of an ABN are often the ACN, but not always, so deriving one would be a guess."
  - canonical_field: "entity.trading_name"
    reason: "Not present. Business names live in a separate ASIC dataset."
  - canonical_field: "entity.website"
    reason: "Not present."
  - canonical_field: "entity.industry_code"
    reason: "Not present. ASIC does not record ANZSIC."
  - canonical_field: "address.full"
    reason: "Only state and postcode are published, no street address."

# Filled by the test step, not by the model. This is what a human reads
# before approving.
validation:
  rows_tested: 200
  rows_emitted: 200
  failures:
    - canonical_field: "entity.entity_type"
      problem: "value not in mapping, fell through to unknown"
      count: 23
      example_values: ["ALCM", "ANSF"]
    - canonical_field: "entity.date_registered"
      problem: "no format matched"
      count: 4
      example_values: ["00/00/0000", ""]
